<header *ngIf="showHeader">
    <nav>
      <div class="img-container">
        <img class="img" src="/assets/full-logo.png" alt="Wise Logo" [routerLink]="['']">
        <img class="img2" src="/assets/logo.png" alt="Wise Logo" [routerLink]="['']">
      </div>
      <nav class="s-menu" [class.open]="hamOpen">
          <div>
            <a [ngClass]="{'active': activeMenuItem === '/'}"
            [routerLink]="['/']" >Home</a>


            <a [ngClass]="{'active': activeMenuItem === '/expertise'}"
            [routerLink]="['/expertise']">Expertise</a> 
            
            <a [ngClass]="{'active': activeMenuItem === '/discover'}"
            [routerLink]="['/discover']">Discover</a>
            
            <a [ngClass]="{'active': activeMenuItem === '/testimonials'}"
            [routerLink]="['/testimonials']">Testimonials</a>
          </div>
          <div> 
            <button [class.open]="hamOpen" [routerLink]="['/contact']">Contact Us</button >
            </div>
      </nav>
    
        <div class="hamburger_menu">
          <input type="checkbox" id="hamburger" (click)="toggleHamburger()" [checked]="hamOpen">
          <label for="hamburger" class="hamburger">
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
          </label>
        </div>
    </nav>
  </header>
